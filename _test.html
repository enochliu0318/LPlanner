<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Test Print View</title>
<link rel="stylesheet" href="css/style.css">
<style>
  #print-root { display: block !important; margin: 20px; }
  @page { size: A4; margin: 20mm 18mm; }
</style>
</head>
<body>
<div id="print-root"></div>
<script>
// Simulate the buildPrintView function with Chinese numbering
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function nl2br(s) { return escapeHtml(s).replace(/\n/g, "<br/>"); }
function buildBulletLines(text) {
  const lines = String(text || "").split("\n").map(s => s.trim()).filter(Boolean);
  return lines.map(l => `<div class="doc-bullet">• ${escapeHtml(l)}</div>`).join("");
}
function addChineseNumbering(html) {
  if (!html.trim()) return html;
  const container = document.createElement("div");
  container.innerHTML = html;
  const CN = ["一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];
  const topLis = container.querySelectorAll(":scope > ul > li");
  topLis.forEach((li, i) => {
    const span = document.createElement("span");
    span.className = "cn-num";
    span.textContent = (CN[i] || (i + 1)) + "、";
    li.insertBefore(span, li.firstChild);
  });
  return container.innerHTML;
}

const contentHtml = `
<ul>
  <li><b>Warm-up</b><ul>
    <li>Greeting</li>
    <li>Review previous lesson</li>
  </ul></li>
  <li><b>Presentation</b><ul>
    <li>Introduce new vocabulary</li>
  </ul></li>
  <li><b>Practice</b></li>
</ul>`;

const plan = {
  courseName: "Magic Tree House",
  courseCategory: "English",
  teacher: "Enoch",
  teachDate: "2026-09-07",
  lessonTitle: "Chapter 1",
  hours: "0.5",
  objectives: "Students will be able to...",
  keyPoints: "New vocabulary",
  difficultPoints: "Pronunciation",
  methods: "TPR, Group work",
  references: [{label: "Textbook", url: "http://example.com"}],
  contentHtml: contentHtml,
  homework: "Read chapter 1\nPractice vocabulary",
  summary: "Good lesson"
};

const root = document.querySelector("#print-root");
root.innerHTML = `
  <h1 class="doc-title">授&nbsp;课&nbsp;教&nbsp;案</h1>
  <div class="doc-info">
    <p><span class="doc-label">课程名称：</span><span class="doc-value">${escapeHtml(plan.courseName)}</span></p>
    <p><span class="doc-label">课程类别：</span><span class="doc-value">${escapeHtml(plan.courseCategory)}</span></p>
    <p><span class="doc-label">任课教师：</span><span class="doc-value">${escapeHtml(plan.teacher)}</span></p>
    <p><span class="doc-label">任课时间：</span><span class="doc-value">${escapeHtml(plan.teachDate)}</span></p>
  </div>
  <div class="doc-banner">●&ensp;教案部分：每 1 学时/60 分钟一个教案</div>
  <table class="doc-table">
    <tr><th>课&emsp;&emsp;题</th><td>${escapeHtml(plan.lessonTitle)}</td></tr>
    <tr><th>学&emsp;&emsp;时</th><td>${escapeHtml(String(plan.hours || ""))}</td></tr>
    <tr><th>教学目标<br/>与要求</th><td class="doc-multiline">${nl2br(plan.objectives)}</td></tr>
    <tr><th>重&emsp;&emsp;点</th><td class="doc-multiline">${nl2br(plan.keyPoints)}</td></tr>
    <tr><th>难&emsp;&emsp;点</th><td class="doc-multiline">${nl2br(plan.difficultPoints)}</td></tr>
    <tr><th>教学方法<br/>与手段</th><td class="doc-multiline">${nl2br(plan.methods)}</td></tr>
    <tr><th>参考资料</th><td class="doc-multiline">Textbook：http://example.com</td></tr>
  </table>
  <div class="doc-banner">●&ensp;讲稿部分（教学内容及过程）每课次连续完整，任课教师应逐课次完整填写讲稿</div>
  <table class="doc-table doc-process">
    <tr><th class="doc-process-head">教学内容及过程</th><th class="doc-process-remarks-head">备注</th></tr>
    <tr>
      <td class="doc-process-content doc-multiline">${addChineseNumbering(plan.contentHtml || "")}</td>
      <td class="doc-process-remarks doc-multiline">${nl2br(plan.remarks)}</td>
    </tr>
    <tr><td class="doc-row-label">作业布置</td><td class="doc-process-remarks"></td></tr>
    <tr><td class="doc-multiline">${buildBulletLines(plan.homework)}</td><td class="doc-process-remarks"></td></tr>
    <tr><td class="doc-row-label">课后小结</td><td class="doc-process-remarks"></td></tr>
    <tr><td class="doc-tall doc-multiline">${nl2br(plan.summary)}</td><td class="doc-process-remarks"></td></tr>
  </table>
`;
</script>
</body>
</html>
