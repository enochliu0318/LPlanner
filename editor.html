<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>编辑教案 · 备课本</title>
<link rel="stylesheet" href="css/style.css?v=17" />
</head>
<body>
<div class="app-shell">

  <aside class="app-rail">
    <div class="brand">备课本
      <small>Lesson Notebook</small>
    </div>
    <nav>
      <a href="index.html">我的教案</a>
      <a href="editor.html" class="active">＋ 新建教案</a>
    </nav>
    <div class="rail-tabs" id="rail-tabs"></div>
    <div class="rail-foot">
      <span class="rail-foot-text">“无论做什么，都要从心里做，像是给主做的，不是给人做的。”</span>
    </div>
  </aside>

  <main class="app-main">
    <div class="page-head">
      <div>
        <h1 id="page-title">编辑教案</h1>
        <p>“智慧人必发光，如同天上的光；那使多人归义的，必发光如星，直到永永远远。”</p>
      </div>
      <div class="toolbar">
        <a class="btn btn-ghost" href="index.html">← 返回列表</a>
        <button class="btn" id="export-pdf-btn">导出 PDF</button>
        <button class="btn" id="export-docx-btn">导出 Word</button>
        <button class="btn btn-danger btn-ghost" id="delete-btn">删除</button>
      </div>
    </div>

    <form id="plan-form">

      <section class="form-section">
        <h2>基本信息</h2>
        <div class="field-grid">
          <div class="field">
            <label for="courseName">课程名称</label>
            <input type="text" id="courseName" />
          </div>
          <div class="field">
            <label for="courseCategory">课程类别</label>
            <input type="text" id="courseCategory" />
          </div>
          <div class="field">
            <label for="teacher">任课教师</label>
            <input type="text" id="teacher" />
          </div>
          <div class="field">
            <label for="teachDate">任课时间</label>
            <input type="date" id="teachDate" />
          </div>
          <div class="field">
            <label for="lessonTitle">课题</label>
            <input type="text" id="lessonTitle" />
          </div>
          <div class="field">
            <label for="hours">学时（每学时 60 分钟）</label>
            <input type="number" id="hours" min="0.5" step="0.5" value="1" />
          </div>
        </div>
      </section>

      <section class="form-section">
        <h2>教学目标与要求</h2>
        <div class="field full">
          <textarea id="objectives" placeholder="本课教学目标与要求..."></textarea>
        </div>
        <div class="field-grid" style="margin-top:14px">
          <div class="field">
            <label for="keyPoints">教学重点</label>
            <textarea id="keyPoints" placeholder="本课重点掌握的知识与技能..." style="min-height:72px"></textarea>
          </div>
          <div class="field">
            <label for="difficultPoints">教学难点</label>
            <textarea id="difficultPoints" placeholder="学生较难理解、需要重点突破的内容..." style="min-height:72px"></textarea>
          </div>
        </div>
      </section>

      <section class="form-section">
        <h2>教学方法与手段</h2>
        <div class="field full">
          <textarea id="methods" placeholder="本课采用的教学方法与手段..." style="min-height:72px"></textarea>
        </div>
      </section>

      <section class="form-section">
        <h2>参考资料</h2>
        <div id="references-list"></div>
        <button type="button" class="btn btn-sm add-row-btn" id="add-reference-btn">＋ 添加一条参考资料</button>
      </section>

      <section class="form-section">
        <h2>教学内容及过程</h2>
        <p class="hint" style="margin-bottom:10px">选中文字可加粗、斜体、下划线；用「项目符号」建立条目，选中条目后 Tab 降级、Shift+Tab 升级。</p>
        <div class="rich-toolbar" id="rich-toolbar">
          <button type="button" class="rt-btn" data-cmd="bold" title="加粗"><b>B</b></button>
          <button type="button" class="rt-btn rt-italic" data-cmd="italic" title="斜体"><i>I</i></button>
          <button type="button" class="rt-btn rt-underline" data-cmd="underline" title="下划线"><u>U</u></button>
          <span class="rt-divider"></span>
          <button type="button" class="rt-btn" data-cmd="insertUnorderedList" title="项目符号（一级条目）">• 项目符号</button>
          <button type="button" class="rt-btn" data-cmd="outdent" title="提升层级（减少缩进）">⇤ 升级</button>
          <button type="button" class="rt-btn" data-cmd="indent" title="降低层级（增加缩进）">⇥ 降级</button>
        </div>
        <div id="content-editor" class="rich-editor" contenteditable="true" data-placeholder="按讲课顺序输入讲稿..."></div>
        <div class="field full" style="margin-top:16px">
          <label for="remarks">备注</label>
          <textarea id="remarks" placeholder="课堂提醒、时间分配、差异化教学提示等..."></textarea>
        </div>
      </section>

      <section class="form-section">
        <h2>作业布置</h2>
        <div class="field full">
          <textarea id="homework" placeholder="本课作业布置..."></textarea>
        </div>
      </section>

      <section class="form-section">
        <h2>课后小结</h2>
        <div class="field full">
          <textarea id="summary" placeholder="课后填写：学生掌握情况、下次课调整方向..."></textarea>
        </div>
      </section>

    </form>

    <div class="save-bar">
      <span class="save-status" id="save-status">尚未保存</span>
      <button class="btn btn-primary" id="save-btn">保存教案</button>
    </div>

  </main>

  <!-- ============ AI 悬浮对话窗口 ============ -->
  <button class="ai-fab" id="ai-fab" title="AI 辅助备课">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- <path d="M12 2a10 10 0 0 1 10 10c0 5.523-4.477 10-10 10a10 10 0 0 1-10-10c0-5.523 4.477-10 10-10z"/> -->
      <path d="M6 12h12M12 6v12"/>
    </svg>
    <span class="ai-fab-badge" id="ai-fab-badge" style="display:none"></span>
  </button>

  <div class="ai-chat" id="ai-chat" style="display:none">
    <!-- 聊天头部 -->
    <div class="ai-chat-header">
      <div class="ai-chat-title">
        <span>AI 备课助手</span>
      </div>
      <div class="ai-chat-tools">
        <button class="ai-chat-tool" id="ai-chat-settings" title="设置">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
        <button class="ai-chat-tool" id="ai-chat-close" title="关闭">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 快捷功能 -->
    <div class="ai-quick-actions">
      <button type="button" class="ai-quick-btn" data-ai="polish">✎ 润色内容</button>
      <button type="button" class="ai-quick-btn" data-ai="expand">↔ 扩展内容</button>
      <button type="button" class="ai-quick-btn" data-ai="outline">≡ 生成大纲</button>
      <button type="button" class="ai-quick-btn" data-ai="objectives">◎ 生成目标</button>
    </div>

    <!-- 消息区域 -->
    <div class="ai-messages" id="ai-messages"></div>

    <!-- 输入区域 -->
    <div class="ai-input-area">
      <textarea id="ai-input" placeholder="输入问题或选择上方快捷功能..." rows="2"></textarea>
      <button class="ai-send-btn" id="ai-send" title="发送">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- AI 设置弹窗 -->
  <div class="ai-modal" id="ai-modal" style="display:none">
    <div class="ai-modal-backdrop" id="ai-modal-backdrop"></div>
    <div class="ai-modal-content">
      <h3>AI 设置</h3>
      <div class="field">
        <label for="ai-model-select">模型选择</label>
        <select id="ai-model-select"></select>
      </div>
      <div class="field">
        <label for="ai-api-key">API Key（可选）</label>
        <input type="password" id="ai-api-key" placeholder="gsk_..." />
        <p class="hint">免费 API Key 在 <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a> 创建。不填也可使用，但速率受限。</p>
      </div>
      <div class="ai-test-row">
        <button type="button" class="btn btn-sm btn-ghost" id="ai-test-btn">测试连接</button>
        <span class="ai-test-result" id="ai-test-result"></span>
      </div>
      <div class="ai-modal-actions">
        <button type="button" class="btn btn-primary" id="ai-save-settings">保存</button>
        <button type="button" class="btn btn-ghost" id="ai-cancel-settings">取消</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ 打印视图（导出 PDF 时填充并显示） ============ -->
<div id="print-root"></div>

<div class="toast" id="toast"></div>

<script type="module" src="js/editor.js?v=17"></script>
</body>
</html>
