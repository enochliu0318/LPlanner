<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>编辑教案 · 备课本</title>
<link rel="stylesheet" href="css/style.css?v=2" />
</head>
<body>
<div class="app-shell">

  <aside class="app-rail">
    <div class="brand">备课本
      <small>Lesson Notebook</small>
    </div>
    <nav>
      <a href="index.html">我的教案</a>
      <a href="editor.html" class="active">＋ 新建教案</a>
    </nav>
    <div class="rail-foot">
      <span class="rail-foot-text">教学相长，念念不忘，必有回响。</span>
    </div>
  </aside>

  <main class="app-main">
    <div class="page-head">
      <div>
        <h1 id="page-title">编辑教案</h1>
        <p>填写内容对应上传模板中的"授课教案"与"讲稿部分"两张表。</p>
      </div>
      <div class="toolbar">
        <a class="btn btn-ghost" href="index.html">← 返回列表</a>
        <button class="btn" id="export-pdf-btn">导出 PDF</button>
        <button class="btn" id="export-docx-btn">导出 Word</button>
        <button class="btn btn-danger btn-ghost" id="delete-btn">删除</button>
      </div>
    </div>

    <form id="plan-form">

      <section class="form-section">
        <h2>基本信息</h2>
        <div class="field-grid">
          <div class="field">
            <label for="courseName">课程名称</label>
            <input type="text" id="courseName" placeholder="例如：Magic Tree House" />
          </div>
          <div class="field">
            <label for="courseCategory">课程类别</label>
            <input type="text" id="courseCategory" placeholder="例如：English Reading and Writing" />
          </div>
          <div class="field">
            <label for="teacher">任课教师</label>
            <input type="text" id="teacher" />
          </div>
          <div class="field">
            <label for="teachDate">任课时间</label>
            <input type="date" id="teachDate" />
          </div>
          <div class="field">
            <label for="lessonTitle">课题</label>
            <input type="text" id="lessonTitle" placeholder="例如：Dolphins at Daybreak L1" />
          </div>
          <div class="field">
            <label for="hours">学时（每学时 60 分钟）</label>
            <input type="number" id="hours" min="0.5" step="0.5" value="1" />
          </div>
        </div>
      </section>

      <section class="form-section">
        <h2>教学目标与要求</h2>
        <div class="field full">
          <textarea id="objectives" placeholder="例如：Fill novel chart, 掌握本课重点词汇..."></textarea>
        </div>
      </section>

      <section class="form-section">
        <h2>参考资料</h2>
        <div id="references-list"></div>
        <button type="button" class="btn btn-sm add-row-btn" id="add-reference-btn">＋ 添加一条参考资料</button>
      </section>

      <section class="form-section">
        <h2>教学内容及过程</h2>
        <p class="hint" style="margin-bottom:10px">按讲课顺序添加要点，可设置层级（一级 / 二级 / 三级），对应模板中的多级列表。</p>
        <div id="content-list"></div>
        <button type="button" class="btn btn-sm add-row-btn" id="add-content-btn">＋ 添加一条内容</button>
        <div class="field full" style="margin-top:16px">
          <label for="remarks">备注</label>
          <textarea id="remarks" placeholder="课堂提醒、时间分配、差异化教学提示等"></textarea>
        </div>
      </section>

      <section class="form-section">
        <h2>作业布置</h2>
        <div class="field full">
          <textarea id="homework" placeholder="例如：Writing topic: Traveling to the Moon"></textarea>
        </div>
      </section>

      <section class="form-section">
        <h2>课后小结</h2>
        <div class="field full">
          <textarea id="summary" placeholder="课后填写：学生掌握情况、下次课调整方向..."></textarea>
        </div>
      </section>

      <section class="form-section">
        <div class="ai-placeholder">
          <span>AI 辅助备课功能尚未启用 — 后续可在此接入教案初稿生成 / 内容润色。</span>
          <button type="button" class="btn btn-sm" disabled>即将上线</button>
        </div>
      </section>

    </form>

    <div class="save-bar">
      <span class="save-status" id="save-status">尚未保存</span>
      <button class="btn btn-primary" id="save-btn">保存教案</button>
    </div>
  </main>
</div>

<!-- ============ 打印视图（导出 PDF 时填充并显示） ============ -->
<div id="print-root"></div>

<div class="toast" id="toast"></div>

<script type="module" src="js/editor.js?v=2"></script>
</body>
</html>
